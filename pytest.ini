[pytest]
# ──────────────────────────────────────────────
#  Configuração central do pytest
#  Destino do log → definido dinamicamente em
#  tests/conftest.py via LOGS_PATH do .env
# ──────────────────────────────────────────────
testpaths        = tests
python_files     = test_*.py
python_classes   = Test*
python_functions = test_*

# Formato do log (arquivo e console)
log_format      = %(asctime)s | %(levelname)-8s | %(name)s | %(message)s
log_date_format = %Y-%m-%d %H:%M:%S

# Exibição no console durante a execução
log_cli         = true
log_cli_level   = INFO

# Marcadores personalizados
markers =
    unit:        Testes unitários (sem I/O real)
    integration: Testes de integração (requerem banco ativo)
    slow:        Testes demorados

addopts =
    -v
    --tb=short
    --strict-markers
