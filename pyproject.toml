[tool.poetry]
name = "7daysofcode"
version = "0.1.0"
description = ""
authors = ["Rogerio <rogerio.tonini@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
python-dotenv = "^1.2.2"
sqlalchemy = "^2.0.48"
psycopg2-binary = "^2.9.11"
pytest = "^9.0.2"
pytest-cov = "^7.1.0"
mysql-connector-python = "^9.6.0"


[tool.poetry.group.dev.dependencies]
pandas = "^3.0.1"
pyarrow = "^23.0.1"
pylance = "^3.0.1"


[tool.poetry.group.environment.dependencies]
ipykernel = "^7.2.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]          # raiz do projeto no sys.path
testpaths  = ["tests"]      # pasta onde o pytest vai buscar os testes
markers    = [
    "integracao: testes que requerem banco de dados ativo",
]
